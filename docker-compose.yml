services:
  app:
    image: ai-key-manage:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      HTTPS_PROXY: http://172.24.160.1:7890
      HTTP_PROXY: http://172.24.160.1:7890
      NO_PROXY: localhost,127.0.0.1,host.docker.internal
    restart: unless-stopped
